name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            script: build:win
            artifact: dist/volby-kv2026.exe
          - os: ubuntu-latest
            name: linux-x64
            script: build:linux
            artifact: dist/volby-kv2026

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run ${{ matrix.script }}

      # The binary must be executed on its target platform. A cross-compiled
      # binary has never run, so this is the only place the Linux build is
      # actually proven to work (research R1).
      - name: Smoke-test the binary
        run: ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: volby-kv2026-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error
