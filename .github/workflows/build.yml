name: build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
            script: build:win
            artifact: dist/volby-kv2026.exe
          - os: ubuntu-latest
            name: linux-x64
            script: build:linux
            artifact: dist/volby-kv2026

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint and format check
        run: bun run check

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Build
        run: bun run ${{ matrix.script }}

      # The binary must be executed on its target platform. A cross-compiled
      # binary has never run, so this is the only place the Linux build is
      # actually proven to work (research R1).
      - name: Smoke-test the binary
        run: ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: volby-kv2026-${{ matrix.name }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

  # Attaches both binaries to a GitHub release when a version tag is pushed. Runs only
  # after both matrix jobs pass, so a release can never contain a binary that failed its
  # own platform's smoke test.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Name the binaries by platform
        run: |
          mkdir -p release
          cp artifacts/volby-kv2026-windows-x64/volby-kv2026.exe release/volby-kv2026-windows-x64.exe
          cp artifacts/volby-kv2026-linux-x64/volby-kv2026 release/volby-kv2026-linux-x64
          chmod +x release/volby-kv2026-linux-x64
          ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
